name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # WPF 앱이라 Windows 러너가 필요하다
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/LLMPulse.App -c Release --nologo
      - name: Test
        run: dotnet test src/LLMPulse.Tests -c Release --nologo